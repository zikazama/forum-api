# Reverse proxy HTTPS untuk Forum API (Express di 127.0.0.1:5000).
# Dipasang di server GCP (Compute Engine, Ubuntu 22.04) sebagai
# /etc/nginx/sites-available/forum-api, lalu:
#   sudo ln -s /etc/nginx/sites-available/forum-api /etc/nginx/sites-enabled/forum-api
#   sudo nginx -t && sudo systemctl reload nginx
# Sertifikat TLS dari Let's Encrypt (certbot, metode webroot di /var/www/certbot).

# Batas 90 request per menit per IP untuk resource /threads dan path di dalamnya.
limit_req_zone $binary_remote_addr zone=threads_limit:10m rate=90r/m;

server {
    listen 80;
    server_name yellow-webs-change-slowly.st.a.dcdg.xyz www.yellow-webs-change-slowly.st.a.dcdg.xyz;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name yellow-webs-change-slowly.st.a.dcdg.xyz www.yellow-webs-change-slowly.st.a.dcdg.xyz;

    ssl_certificate /etc/letsencrypt/live/yellow-webs-change-slowly.st.a.dcdg.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yellow-webs-change-slowly.st.a.dcdg.xyz/privkey.pem;

    location /threads {
        limit_req zone=threads_limit burst=90 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
