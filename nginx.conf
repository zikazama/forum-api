# Reverse proxy HTTPS untuk Forum API (Express di 127.0.0.1:5000).
# Ganti YOUR_DOMAIN dengan domain server, lalu pasang:
#   sudo cp nginx.conf /etc/nginx/sites-available/forum-api
#   sudo ln -s /etc/nginx/sites-available/forum-api /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

# Batas 90 request per menit per IP untuk endpoint /threads.
limit_req_zone $binary_remote_addr zone=threads_limit:10m rate=90r/m;

server {
    listen 80;
    server_name YOUR_DOMAIN;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name YOUR_DOMAIN;

    ssl_certificate /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;

    location /threads {
        limit_req zone=threads_limit burst=90 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
